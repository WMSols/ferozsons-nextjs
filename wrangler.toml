name = "ferozsons-nextjs"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Custom domains (must be top-level, not under [assets])
routes = [
  { pattern = "ferozsons-labs.com", custom_domain = true },
  { pattern = "www.ferozsons-labs.com", custom_domain = true }
]

# Serve static assets from the Next.js build
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
